name: Sync Training Progress to Gmeek

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨自动同步一次
  workflow_dispatch: # 支持手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Progress from HF
        env:
          HF_CKPT_REPO: ${{ vars.HF_CKPT_REPO }}
        run: |
          pip install huggingface_hub
          # 去 HF 获取最新的 step.txt
          python -c "
          import os
          from huggingface_hub import hf_hub_download
          try:
              path = hf_hub_download(repo_id=os.environ['HF_CKPT_REPO'], filename='step.txt')
              with open(path, 'r') as f:
                  step = f.read().strip()
          except Exception:
              step = '0'
          print(f'STEP_COUNT={step}')
          " >> $GITHUB_ENV

      - name: Create Issue on Gmeek
        env:
          BLOG_TOKEN: ${{ secrets.BLOG_TOKEN }}
          BLOG_REPO: ynnoh917/ynnoh917.github.io # ⚠️ 这里换成你的 Gmeek 博客仓库名
        run: |
          DATE=$(date +"%Y-%m-%d %H:%M")
          
          # 构造 Issue 的标题和正文
          TITLE="炼丹日志：100M 模型已训练至 ${STEP_COUNT} 步"
          BODY="**哈哈哈！1号测试模型 (100M GPT-2) 仍在云端默默进化中。**\n\n- **当前步数**：\`${STEP_COUNT}\` 步\n- **更新时间**：${DATE}\n- **训练设备**：GitHub Actions (超长待机版)\n\n*只要云端不崩，我就继续学中文！*"
          
          # 调用 GitHub API 创建 Issue
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${BLOG_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${BLOG_REPO}/issues \
            -d "{\"title\":\"${TITLE}\",\"body\":\"${BODY}\",\"labels\":[\"Gmeek\"]}"