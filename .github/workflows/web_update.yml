name: Update Web Dashboard

on:
  schedule:
    - cron: '0 */4 * * *'   # 每 4 小时自动同步一次
  workflow_dispatch:        # 支持手动触发

jobs:
  update-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch progress from Hugging Face
        env:
          HF_CKPT_REPO: ${{ vars.HF_CKPT_REPO }}
        run: |
          pip install huggingface_hub
          mkdir -p docs  # 确保 docs 文件夹存在，防止路径报错
          python -c "
          import os, json
          from huggingface_hub import hf_hub_download
          try:
              # 尝试从 HF 下载最新进度
              path = hf_hub_download(repo_id=os.environ['HF_CKPT_REPO'], filename='progress.json')
              with open(path, 'r') as f:
                  data = json.load(f)
              with open('docs/data.json', 'w') as f:
                  json.dump(data, f)
              print('✅ 同步成功:', data)
          except Exception as e:
              print('⚠️ 暂无数据或拉取失败，生成默认占位数据:', e)
              # 兜底逻辑：如果下载失败，生成一个初始文件，防止后面的 git add 报错
              default_data = {
                  'step': 0, 
                  'loss': 0.0, 
                  'timestamp': '等待云端炼丹炉同步...'
              }
              with open('docs/data.json', 'w') as f:
                  json.dump(default_data, f)
          "

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/data.json
          # 如果没有变化，git commit 会报错，用 || 兜底防止 Actions 失败
          git commit -m "Auto: update dashboard data" || echo "No changes to commit"
          # 如果无法推送，也兜底
          git push || echo "No changes to push"