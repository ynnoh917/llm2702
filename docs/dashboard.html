<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 | 哈哈哈 · 1号测试模型</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <header class="header">
            <div class="title-group">
                <h1 class="glitch" data-text="仪表盘">仪表盘</h1>
                <a href="index.html" class="status-btn">← 返回主界面</a>
            </div>
            <p class="subtitle">// 实时训练状态监控</p>
        </header>

        <div class="dashboard-grid">
            <div class="data-card">
                <span class="card-label">当前步数</span>
                <span class="card-value" id="step-val">--</span>
                <span class="card-unit">步</span>
            </div>
            <div class="data-card">
                <span class="card-label">最新 Loss</span>
                <span class="card-value" id="loss-val">--</span>
            </div>
            <div class="data-card">
                <span class="card-label">更新时间</span>
                <span class="card-value-time" id="time-val">加载中...</span>
            </div>
        </div>

        <div class="status-panel">
            <h3>> 系统状态</h3>
            <ul>
                <li>架构: GPT-2 (100M 参数 · 768 hidden · 8 layers)</li>
                <li>语料: Skywork/SkyPile-150B 流式 + 专属问答混合</li>
                <li>设备: GitHub Actions 免费 CPU Runner</li>
                <li>调度: 每 2 小时自动唤醒 · 每轮 1500 步</li>
            </ul>
        </div>

        <footer class="footer">
            <p class="copyright">数据每 4 小时自动同步自 Hugging Face</p>
        </footer>
    </div>

    <script>
        // 加上 ?v=时间戳，强制浏览器每次获取最新数据，不走缓存
        fetch('data.json?v=' + new Date().getTime())
            .then(res => {
                if (!res.ok) throw new Error("HTTP 状态码: " + res.status);
                return res.json();
            })
            .then(data => {
                console.log("✅ 成功读取进度数据:", data);
                document.getElementById('step-val').innerText = data.step !== undefined ? data.step : '0';
                document.getElementById('loss-val').innerText = data.loss !== undefined ? data.loss : '0.0';
                document.getElementById('time-val').innerText = data.timestamp ? data.timestamp : '等待数据';
            })
            .catch(err => {
                console.error("❌ 数据加载失败:", err);
                document.getElementById('time-val').innerText = '暂无数据文件';
            });
    </script>
</body>
</html>
